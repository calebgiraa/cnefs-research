name: PCSv1
channels:
  - conda-forge
  - defaults
dependencies:
  # --- Core Conda Dependencies ---
  - python=3.10
  - pip
  - numpy
  - scipy
  - mkl
  - mkl-service
  - pyyaml
  - tqdm
  - requests
  - setuptools
  - wheel
  - typing_extensions

  # --- Top-Level Libraries ---
  # These will automatically pull in the correct versions of libwebp, ffmpeg, etc.
  - tesseract
  - opencv
  - openh264
  - protobuf
  
  # --- PyPI (pip) Dependencies ---
  - pip:
    # --- Critical: Tell pip where to find CUDA versions of PyTorch ---
    - --extra-index-url https://download.pytorch.org/whl/cu121
    
